name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run tokens:check
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: bun run test

  # The npm package: compiled ESM with types, "use client" kept, valid exports, size budgets.
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint:package
      - run: bun run size

  # The packed tarball, installed into a fresh app the way a consumer would: a Next.js App Router
  # page that is a Server Component (the 0.1.0 failure), and a Vite app.
  tarball:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [next, vite]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-tarball.ts ${{ matrix.app }}

  # The docs site and the shadcn registry, both generated from src/: a component the registry
  # cannot map, or a page that fails to render, fails here.
  site:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run site:build
      - run: test -f site/dist/ikada/r/registry.json && test -f site/dist/ikada/components/button.html
      - name: llms.txt, a markdown twin per page, sitemap and robots exist
        run: |
          for f in llms.txt llms-full.txt sitemap.xml robots.txt components/button.md installation.md; do
            test -s "site/dist/ikada/$f" || { echo "missing $f" >&2; exit 1; }
          done

  # axe-core on every docs page (so on every example), light and dark. Any violation fails.
  axe:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bunx playwright install --with-deps chromium
      - run: bun run site:build
      - name: axe on every page
        working-directory: site
        run: |
          PORT=4413 bun scripts/preview.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4413/ikada/sitemap.xml >/dev/null && break; sleep 1; done
          bun scripts/axe.ts

  # Every registry item installed into a stock shadcn project (with its own button, input, dialog,
  # sidebar... and lib/utils.ts): the stock files must survive byte for byte, everything lands in
  # components/ikada, and tsc and the build pass. `shadcn build` validates the registry first.
  registry:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [next, vite]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-registry.ts ${{ matrix.app }}

  # Screenshot and overflow checks of the playground at 390px and 1440px, light and dark.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: .e2e-output
          if-no-files-found: ignore
