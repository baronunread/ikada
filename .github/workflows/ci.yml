name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run tokens:check
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: bun run test

  # The npm package: compiled ESM with types, "use client" kept, valid exports, size budgets.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint:package
      - run: bun run size

  # The packed tarball, installed into a fresh app the way a consumer would: a Next.js App Router
  # page that is a Server Component (the 0.1.0 failure), and a Vite app.
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [next, vite]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-tarball.ts ${{ matrix.app }}

  # The docs site and the shadcn registry, both generated from src/: a component the registry
  # cannot map, or a page that fails to render, fails here.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run site:build
      - run: test -f site/dist/ikada/r/registry.json && test -f site/dist/ikada/components/button.html

  # Screenshot and overflow checks of the playground at 390px and 1440px, light and dark.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: .e2e-output
          if-no-files-found: ignore
